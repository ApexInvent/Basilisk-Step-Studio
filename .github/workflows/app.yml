# Builds the installer and publishes it as an update.
#
# Two things have to line up for an update to reach anyone. The installer has to be signed
# with the key whose public half is in tauri.conf.json, and a latest.json describing it has
# to sit on the release the app polls. tauri-action does both, given the signing key.
#
# The engine is not in this repository, so it is pulled from the engine-latest release and
# bundled. That is the same copy the app would otherwise download on first run, which means a
# fresh install converts a file without touching the network.

name: Build app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Publish the release as a draft
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # A tag that does not match the version in the app is the failure that is hardest to
      # spot later: the installer works, and the updater silently never offers it.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            FOUND=$(node -p "require('./$file').version")
            if [ "$FOUND" != "$TAG" ]; then
              echo "$file says $FOUND but the tag says $TAG"
              exit 1
            fi
          done
          echo "Version $TAG agrees everywhere"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Bundled rather than downloaded on first run, so a fresh install works offline.
      - name: Fetch the engine
        shell: bash
        run: |
          gh release download engine-latest --pattern stl2step-windows-x64.zip --dir .
          7z x stl2step-windows-x64.zip -oengine
          test -f engine/stl2step.exe || { echo "No engine in the archive"; exit 1; }
          ls engine | head
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: Basilisk Step Studio ${{ github.ref_name }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          # Writes latest.json beside the installer. Without it the app has nothing to poll.
          includeUpdaterJson: true
